apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: todo-app-dev
  namespace: argocd
spec:
  project: default

  source:
    repoURL: https://github.com/tdesai2705/unify-ref-todo-infrastructure
    targetRevision: main
    path: kubernetes/dev

  destination:
    server: https://kubernetes.default.svc
    namespace: dev-todo-app

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
      allowEmpty: false
    syncOptions:
    - CreateNamespace=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m

